<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Want to make list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.fw}}; text-decoration: none; white-space: nowrap">{{n.label}}</a>
      </sc-for>
    </div>
    <a href="Account.dc.html" aria-label="Account" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{acctBg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{acctFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </a>
  </nav>
  <header style="padding: 18px 20px 12px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Want to make</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #59615C">4 recipes · oldest first</p>
  </header>
  <ul style="flex: 1; list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <sc-for list="{{items}}" as="r" hint-placeholder-count="4">
      <li style="display: flex; align-items: center; gap: 14px; padding: 10px; background: #FFFFFF; border-radius: 14px">
        <a href="RecipeView.dc.html" style="display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; text-decoration: none; color: #1D2420">
          <div role="img" aria-label="{{r.name}} photo" style="flex: none; width: 64px; height: 64px; border-radius: 10px; background: {{r.tint}}"></div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 18px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 14px; color: #59615C">Added {{r.added}}</span>
          </div>
        </a>
        <button type="button" aria-label="Remove {{r.name}} from the Want to make list" style="flex: none; width: 44px; height: 44px; border: 1px solid #DCDFDA; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#59615C" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  navItems(cur) {
    const pages = [['Recipes', 'ListEditor.dc.html'], ['Want to make', 'ToMake.dc.html'], ['Rediscover', 'Rediscover.dc.html'], ['Trash', 'Trash.dc.html']];
    return pages.map(([label, href]) => {
      const on = label === cur;
      return { label, href, current: on ? 'page' : 'false', bg: on ? '#2E6A4F' : 'transparent', fg: on ? '#FFFFFF' : '#1D2420', fw: on ? '700' : '400' };
    });
  }
  renderVals() {
    return {
      nav: this.navItems('Want to make'), acctBg: '#F0F2EE', acctFg: '#1D2420',
      items: [
        { name: 'Lemon Risotto', added: 'Oct 12', tint: '#E9E2B8' },
        { name: 'Chicken Tikka Masala', added: 'Oct 20', tint: '#E6C3A8' },
        { name: 'Shakshuka', added: 'Oct 24', tint: '#E5BFAE' },
        { name: 'Fish Tacos', added: 'Oct 29', tint: '#CFDCCB' }
      ]
    };
  }
}
</script>
</body>
</html>
