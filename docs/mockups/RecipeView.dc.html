<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe view — editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 1800px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.fw}}; text-decoration: none; white-space: nowrap">{{n.label}}</a>
      </sc-for>
    </div>
    <a href="Account.dc.html" aria-label="Account" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{acctBg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{acctFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </a>
  </nav>
  <div role="img" aria-label="Pad Thai photo" style="height: 230px; background: #E8CFB0"></div>
  <main style="display: flex; flex-direction: column; gap: 22px; padding: 20px">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 8px; background: #FBEADC; color: #8A3A0C; font-size: 13px; font-weight: 700">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A3A0C" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
          Plan
        </span>
      </div>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 700">Pad Thai</h1>
      <p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 16px; color: #59615C">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#59615C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
        30 min total
      </p>
      <ul aria-label="Tags" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
        <li style="padding: 6px 12px; border-radius: 16px; background: #E3EEE7; color: #1F4D38; font-size: 15px">dinner</li>
        <li style="padding: 6px 12px; border-radius: 16px; background: #E3EEE7; color: #1F4D38; font-size: 15px">noodles</li>
        <li style="padding: 6px 12px; border-radius: 16px; background: #E3EEE7; color: #1F4D38; font-size: 15px">quick</li>
      </ul>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #FFFFFF; border-radius: 16px">
      <button type="button" style="min-height: 48px; border: 1px solid #C9CEC8; border-radius: 14px; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 16px">I cooked this today</button>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 6px 0 14px; border-radius: 14px; background: #FBEADC; color: #8A3A0C">
        <span style="font-size: 16px; font-weight: 700">On your plan ✓</span>
        <button type="button" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #8A3A0C; font: inherit; font-size: 15px; text-decoration: underline">Remove</button>
      </div>
      <p style="margin: 4px 0 0; font-size: 15px; color: #59615C">Last cooked Aug 2 · cooked 6 times · <a href="#history" style="font-weight: 700">History</a></p>
    </section>
    <section>
      <h2 style="margin: 0 0 4px; font-size: 22px; font-weight: 700">Ingredients</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
        <sc-for list="{{ingredients}}" as="i" hint-placeholder-count="10">
          <li style="border-bottom: 1px solid #E4E6E1">
            <label style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 4px 0; cursor: pointer">
              <input type="checkbox" checked="{{i.checked}}" onChange="{{i.toggle}}" style="flex: none; width: 24px; height: 24px; margin: 0; accent-color: #2E6A4F">
              <span style="font-size: 19px; line-height: 1.35; color: {{i.fg}}; text-decoration: {{i.deco}}">{{i.text}}</span>
            </label>
          </li>
        </sc-for>
      </ul>
    </section>
    <section>
      <h2 style="margin: 0 0 10px; font-size: 22px; font-weight: 700">Prep</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{prep}}" as="s" hint-placeholder-count="3">
          <li style="display: flex; gap: 8px; align-items: flex-start">
            <button type="button" aria-pressed="{{s.pressed}}" aria-label="{{s.label}}" onClick="{{s.toggle}}" style="flex: none; width: 44px; height: 44px; margin-top: -4px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <span style="width: 34px; height: 34px; border-radius: 17px; background: {{s.bg}}; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">
                <sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
                </sc-if>
                <sc-if value="{{s.todo}}" hint-placeholder-val="{{ true }}">{{s.n}}</sc-if>
              </span>
            </button>
            <span style="font-size: 19px; line-height: 1.45; color: {{s.fg}}">{{s.text}}</span>
          </li>
        </sc-for>
      </ol>
    </section>
    <section>
      <h2 style="margin: 0 0 10px; font-size: 22px; font-weight: 700">Steps</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <li style="display: flex; gap: 8px; align-items: flex-start">
            <button type="button" aria-pressed="{{s.pressed}}" aria-label="{{s.label}}" onClick="{{s.toggle}}" style="flex: none; width: 44px; height: 44px; margin-top: -4px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <span style="width: 34px; height: 34px; border-radius: 17px; background: {{s.bg}}; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">
                <sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
                </sc-if>
                <sc-if value="{{s.todo}}" hint-placeholder-val="{{ true }}">{{s.n}}</sc-if>
              </span>
            </button>
            <span style="font-size: 19px; line-height: 1.45; color: {{s.fg}}">{{s.text}}</span>
          </li>
        </sc-for>
      </ol>
    </section>
    <section style="display: flex; gap: 10px; padding-top: 8px; border-top: 1px solid #DCDFDA">
      <a href="EditForm.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 14px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font-size: 16px; font-weight: 700; text-decoration: none">Edit</a>
      <a href="DeletedUndo.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 14px; color: #B42318; font-size: 16px; text-decoration: none">Delete</a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1800}}'>
class Component extends DCLogic {
  navItems(cur) {
    const pages = [['Catalog', 'ListEditor.dc.html'], ['Plan', 'ToMake.dc.html'], ['Recommendations', 'Rediscover.dc.html'], ['Trash', 'Trash.dc.html']];
    return pages.map(([label, href]) => {
      const on = label === cur;
      return { label, href, current: on ? 'page' : 'false', bg: on ? '#2E6A4F' : 'transparent', fg: on ? '#FFFFFF' : '#1D2420', fw: on ? '700' : '400' };
    });
  }
  ticks(key, fallback) {
    return (this.state && this.state[key]) || fallback;
  }
  flip(key, arr, i) {
    const next = arr.slice();
    next[i] = !next[i];
    this.setState({ [key]: next });
  }
  numbered(entries, done, noun, key) {
    return entries.map((text, i) => ({
      n: i + 1, text, done: !!done[i], todo: !done[i],
      pressed: done[i] ? 'true' : 'false',
      label: noun + ' ' + (i + 1) + ' done',
      bg: done[i] ? '#2E6A4F' : '#1D2420', fg: done[i] ? '#59615C' : '#1D2420',
      toggle: () => this.flip(key, done, i)
    }));
  }
  renderVals() {
    const ingredients = [
      '200 g flat rice noodles',
      '3 tbsp tamarind paste',
      '3 tbsp fish sauce',
      '2 tbsp brown sugar',
      '2 cloves garlic',
      '1 shallot',
      '200 g prawns',
      '2 eggs',
      '1 cup bean sprouts',
      'Peanuts, spring onions and lime to serve'
    ];
    const prep = [
      'Soak the rice noodles in warm water for 25 minutes, then drain.',
      'Chop the garlic and slice the shallot.',
      'Stir the tamarind, fish sauce and sugar together until the sugar dissolves.'
    ];
    const steps = [
      'Fry the garlic and shallot in a hot wok for 30 seconds.',
      'Add the prawns and cook until pink. Push to one side and scramble the eggs.',
      'Add the noodles and sauce; toss for 2 minutes until the noodles soften.',
      'Fold in the bean sprouts and spring onions. Serve with peanuts and lime.'
    ];
    const ingDone = this.ticks('ingDone', ingredients.map((_, i) => i < 4));
    const prepDone = this.ticks('prepDone', prep.map(() => true));
    const stepDone = this.ticks('stepDone', steps.map((_, i) => i < 1));
    return {
      nav: this.navItems('Catalog'), acctBg: '#F0F2EE', acctFg: '#1D2420',
      ingredients: ingredients.map((text, i) => ({
        text, checked: !!ingDone[i],
        fg: ingDone[i] ? '#59615C' : '#1D2420', deco: ingDone[i] ? 'line-through' : 'none',
        toggle: () => this.flip('ingDone', ingDone, i)
      })),
      prep: this.numbered(prep, prepDone, 'Prep', 'prepDone'),
      steps: this.numbered(steps, stepDone, 'Step', 'stepDone')
    };
  }
}
</script>
</body>
</html>
