<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe deleted — Undo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.fw}}; text-decoration: none; white-space: nowrap">{{n.label}}</a>
      </sc-for>
    </div>
    <a href="Account.dc.html" aria-label="Account" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{acctBg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{acctFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </a>
  </nav>
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 16px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Catalog</h1>
    <a href="EditForm.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #2E6A4F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Add recipe</a>
  </header>
  <ul style="flex: 1; list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <sc-for list="{{recipes}}" as="r" hint-placeholder-count="5">
      <li style="display: flex; align-items: center; gap: 14px; padding: 10px; background: #FFFFFF; border-radius: 14px">
        <div role="img" aria-label="{{r.name}} photo" style="flex: none; width: 64px; height: 64px; border-radius: 10px; background: {{r.tint}}"></div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 18px; font-weight: 700">{{r.name}}</span>
          <span style="font-size: 14px; color: #59615C">{{r.meta}}</span>
        </div>
      </li>
    </sc-for>
  </ul>
  <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 18px; background: #1D2420; color: #FFFFFF; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.18)">
    <span style="font-size: 16px">Pad Thai moved to trash</span>
    <button type="button" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #7FC4A0; color: #10241A; font: inherit; font-size: 16px; font-weight: 700">Undo</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  navItems(cur) {
    const pages = [['Catalog', 'ListEditor.dc.html'], ['Plan', 'ToMake.dc.html'], ['Recommendations', 'Rediscover.dc.html'], ['Trash', 'Trash.dc.html']];
    return pages.map(([label, href]) => {
      const on = label === cur;
      return { label, href, current: on ? 'page' : 'false', bg: on ? '#2E6A4F' : 'transparent', fg: on ? '#FFFFFF' : '#1D2420', fw: on ? '700' : '400' };
    });
  }
  renderVals() {
    return {
      nav: this.navItems('Catalog'), acctBg: '#F0F2EE', acctFg: '#1D2420',
      recipes: [
        { name: 'Beef Stew', meta: '2 h 30 min · dinner, slow', tint: '#D9C7B4' },
        { name: 'Chicken Tikka Masala', meta: '50 min · curry, dinner', tint: '#E6C3A8' },
        { name: 'Chickpea Curry', meta: '35 min · curry, vegetarian', tint: '#E3D3A4' },
        { name: 'Fish Tacos', meta: '30 min · dinner, quick', tint: '#CFDCCB' },
        { name: 'Lemon Risotto', meta: '40 min · vegetarian', tint: '#E9E2B8' },
        { name: 'Shakshuka', meta: '25 min · eggs, quick', tint: '#E5BFAE' }
      ]
    };
  }
}
</script>
</body>
</html>
