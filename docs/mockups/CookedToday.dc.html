<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooked today state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.fw}}; text-decoration: none; white-space: nowrap">{{n.label}}</a>
      </sc-for>
    </div>
    <a href="Account.dc.html" aria-label="Account" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{acctBg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{acctFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </a>
  </nav>
  <div role="img" aria-label="Chicken Tikka Masala photo" style="height: 200px; background: #E6C3A8"></div>
  <main style="display: flex; flex-direction: column; gap: 22px; padding: 20px">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 700">Chicken Tikka Masala</h1>
      <p style="margin: 0; font-size: 16px; color: #59615C">50 min total</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="padding: 6px 12px; border-radius: 16px; background: #E3EEE7; color: #1F4D38; font-size: 15px">curry</span>
        <span style="padding: 6px 12px; border-radius: 16px; background: #E3EEE7; color: #1F4D38; font-size: 15px">dinner</span>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #FFFFFF; border-radius: 16px">
      <button type="button" disabled style="min-height: 56px; border: 1px solid #A9CDB8; border-radius: 14px; background: #E3EEE7; color: #1F4D38; font: inherit; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        Cooked today
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4D38" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </button>
      <button type="button" style="min-height: 48px; border: 1px solid #C9CEC8; border-radius: 14px; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 16px">I want to cook this</button>
      <p style="margin: 4px 0 0; font-size: 15px; color: #59615C">Last cooked today · cooked 4 times · <a href="#history" style="font-weight: 700">History</a></p>
    </section>
    <section>
      <h2 style="margin: 0 0 10px; font-size: 22px; font-weight: 700">Ingredients</h2>
      <p style="margin: 0; padding: 10px 0; border-bottom: 1px solid #E4E6E1; font-size: 19px">600 g chicken thighs</p>
      <p style="margin: 0; padding: 10px 0; border-bottom: 1px solid #E4E6E1; font-size: 19px">1 cup plain yogurt</p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  navItems(cur) {
    const pages = [['Recipes', 'ListEditor.dc.html'], ['Want to make', 'ToMake.dc.html'], ['Rediscover', 'Rediscover.dc.html'], ['Trash', 'Trash.dc.html']];
    return pages.map(([label, href]) => {
      const on = label === cur;
      return { label, href, current: on ? 'page' : 'false', bg: on ? '#2E6A4F' : 'transparent', fg: on ? '#FFFFFF' : '#1D2420', fw: on ? '700' : '400' };
    });
  }
  renderVals() {
    return { nav: this.navItems('Recipes'), acctBg: '#F0F2EE', acctFg: '#1D2420' };
  }
}
</script>
</body>
</html>
