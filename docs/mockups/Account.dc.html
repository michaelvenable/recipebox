<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.fw}}; text-decoration: none; white-space: nowrap">{{n.label}}</a>
      </sc-for>
    </div>
    <a href="Account.dc.html" aria-label="Account" aria-current="page" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{acctBg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{acctFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </a>
  </nav>
  <header style="padding: 18px 20px 14px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Account</h1>
  </header>
  <main style="display: flex; flex-direction: column; gap: 16px; padding: 0 20px">
    <dl style="margin: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; background: #FFFFFF; border-radius: 16px">
      <div>
        <dt style="font-size: 14px; color: #59615C">Signed in with</dt>
        <dd style="margin: 2px 0 0; font-size: 17px">Google</dd>
      </div>
      <div>
        <dt style="font-size: 14px; color: #59615C">Account ID</dt>
        <dd style="margin: 4px 0 0; display: flex; align-items: center; gap: 8px">
          <code style="flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; background: #F0F2EE; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; overflow-wrap: anywhere">google:109876543210987654321</code>
          <button type="button" style="flex: none; min-height: 44px; padding: 0 14px; border: 1px solid #C9CEC8; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 15px">Copy</button>
        </dd>
      </div>
      <div>
        <dt style="font-size: 14px; color: #59615C">Access</dt>
        <dd style="margin: 4px 0 0"><span style="display: inline-block; padding: 4px 10px; border-radius: 8px; background: #E3EEE7; color: #1F4D38; font-size: 15px; font-weight: 700">Editor</span></dd>
      </div>
    </dl>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #59615C">Not an editor yet? Send this ID to the app's owner to be added to the editor list.</p>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 14px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font-size: 16px; font-weight: 700; text-decoration: none">Sign out</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  navItems(cur) {
    const pages = [['Recipes', 'ListEditor.dc.html'], ['Want to make', 'ToMake.dc.html'], ['Rediscover', 'Rediscover.dc.html'], ['Trash', 'Trash.dc.html']];
    return pages.map(([label, href]) => {
      const on = label === cur;
      return { label, href, current: on ? 'page' : 'false', bg: on ? '#2E6A4F' : 'transparent', fg: on ? '#FFFFFF' : '#1D2420', fw: on ? '700' : '400' };
    });
  }
  renderVals() {
    return { nav: this.navItems(''), acctBg: '#2E6A4F', acctFg: '#FFFFFF' };
  }
}
</script>
</body>
</html>
