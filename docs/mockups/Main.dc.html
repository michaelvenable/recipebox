<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe Box — visitor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <a href="Main.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: #2E6A4F; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">Catalog</a>
    <a href="Account.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #2E6A4F; font-size: 15px; font-weight: 700">Sign in</a>
  </nav>
  <header style="padding: 18px 20px 12px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Recipe Box</h1>
  </header>
  <div style="padding: 0 20px">
    <label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search by name</label>
    <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #FFFFFF; border: 1px solid #C9CEC8; border-radius: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#59615C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="search" type="search" placeholder="Find a recipe" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 17px; background: transparent; color: #1D2420">
    </div>
  </div>
  <div style="display: flex; gap: 8px; padding: 14px 20px 6px; overflow-x: auto">
    <button type="button" aria-pressed="true" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2E6A4F; background: #2E6A4F; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">dinner · 24</button>
    <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">quick · 11</button>
    <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">vegetarian · 9</button>
    <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">curry · 4</button>
    <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">dessert · 6</button>
  </div>
  <ul style="list-style: none; margin: 0; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{recipes}}" as="r" hint-placeholder-count="7">
      <li>
        <a href="RecipeView.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px; background: #FFFFFF; border-radius: 14px; text-decoration: none; color: #1D2420">
          <div role="img" aria-label="{{r.name}} photo" style="flex: none; width: 64px; height: 64px; border-radius: 10px; background: {{r.tint}}"></div>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 18px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 14px; color: #59615C">{{r.meta}}</span>
          </div>
        </a>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      recipes: [
        { name: 'Beef Stew', meta: '2 h 30 min · dinner, slow', tint: '#D9C7B4' },
        { name: 'Chicken Tikka Masala', meta: '50 min · curry, dinner', tint: '#E6C3A8' },
        { name: 'Chickpea Curry', meta: '35 min · curry, dinner, vegetarian', tint: '#E3D3A4' },
        { name: 'Fish Tacos', meta: '30 min · dinner, quick', tint: '#CFDCCB' },
        { name: 'Lemon Risotto', meta: '40 min · dinner, vegetarian', tint: '#E9E2B8' },
        { name: 'Pad Thai', meta: '30 min · dinner, noodles, quick', tint: '#E8CFB0' },
        { name: 'Shakshuka', meta: '25 min · dinner, eggs, quick', tint: '#E5BFAE' }
      ]
    };
  }
}
</script>
</body>
</html>
