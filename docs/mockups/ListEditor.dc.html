<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe list — editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.fw}}; text-decoration: none; white-space: nowrap">{{n.label}}</a>
      </sc-for>
    </div>
    <a href="Account.dc.html" aria-label="Account" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{acctBg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{acctFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </a>
  </nav>
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Recipes</h1>
    <a href="EditForm.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #2E6A4F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Add recipe
    </a>
  </header>
  <div style="padding: 0 20px">
    <label for="search2" style="display: block; font-size: 14px; color: #59615C; margin-bottom: 6px">Search by name</label>
    <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #FFFFFF; border: 1px solid #C9CEC8; border-radius: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#59615C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="search2" type="search" placeholder="e.g. curry" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 17px; background: transparent; color: #1D2420">
    </div>
  </div>
  <div style="display: flex; gap: 8px; padding: 14px 20px 10px; overflow-x: auto">
    <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">dinner · 24</button>
    <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">quick · 11</button>
    <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">vegetarian · 9</button>
    <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">curry · 4</button>
  </div>
  <ul style="flex: 1; list-style: none; margin: 0; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
      <li>
        <a href="RecipeView.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px; background: #FFFFFF; border-radius: 14px; text-decoration: none; color: #1D2420">
          <div role="img" aria-label="{{r.name}} photo" style="flex: none; width: 64px; height: 64px; border-radius: 10px; background: {{r.tint}}"></div>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1">
            <span style="font-size: 18px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 14px; color: #59615C">{{r.meta}}</span>
          </div>
          <sc-if value="{{r.toMake}}" hint-placeholder-val="{{false}}">
            <span style="flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 8px; background: #FBEADC; color: #8A3A0C; font-size: 13px; font-weight: 700">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A3A0C" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
              Want to make
            </span>
          </sc-if>
        </a>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  navItems(cur) {
    const pages = [['Recipes', 'ListEditor.dc.html'], ['Want to make', 'ToMake.dc.html'], ['Rediscover', 'Rediscover.dc.html'], ['Trash', 'Trash.dc.html']];
    return pages.map(([label, href]) => {
      const on = label === cur;
      return { label, href, current: on ? 'page' : 'false', bg: on ? '#2E6A4F' : 'transparent', fg: on ? '#FFFFFF' : '#1D2420', fw: on ? '700' : '400' };
    });
  }
  renderVals() {
    return {
      nav: this.navItems('Recipes'), acctBg: '#F0F2EE', acctFg: '#1D2420',
      recipes: [
        { name: 'Beef Stew', meta: '2 h 30 min · dinner, slow', tint: '#D9C7B4', toMake: false },
        { name: 'Chicken Tikka Masala', meta: '50 min · curry, dinner', tint: '#E6C3A8', toMake: true },
        { name: 'Chickpea Curry', meta: '35 min · curry, vegetarian', tint: '#E3D3A4', toMake: false },
        { name: 'Fish Tacos', meta: '30 min · dinner, quick', tint: '#CFDCCB', toMake: false },
        { name: 'Lemon Risotto', meta: '40 min · vegetarian', tint: '#E9E2B8', toMake: true },
        { name: 'Pad Thai', meta: '30 min · noodles, quick', tint: '#E8CFB0', toMake: false }
      ]
    };
  }
}
</script>
</body>
</html>
