<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recommendations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.fw}}; text-decoration: none; white-space: nowrap">{{n.label}}</a>
      </sc-for>
    </div>
    <a href="Account.dc.html" aria-label="Account" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{acctBg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{acctFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </a>
  </nav>
  <header style="padding: 18px 20px 12px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Recommendations</h1>
  </header>
  <ul style="flex: 1; list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <sc-for list="{{items}}" as="r" hint-placeholder-count="6">
      <li>
        <a href="RecipeView.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px; background: #FFFFFF; border-radius: 14px; text-decoration: none; color: #1D2420">
          <div role="img" aria-label="{{r.name}} photo" style="flex: none; width: 56px; height: 56px; border-radius: 10px; background: {{r.tint}}"></div>
          <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
            <span style="font-size: 18px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 14px; color: #59615C">{{r.last}}</span>
          </div>
          <span style="flex: none; font-size: 15px; font-weight: 700; color: {{r.agoColor}}">{{r.ago}}</span>
        </a>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  navItems(cur) {
    const pages = [['Catalog', 'ListEditor.dc.html'], ['Plan', 'ToMake.dc.html'], ['Recommendations', 'Rediscover.dc.html'], ['Trash', 'Trash.dc.html']];
    return pages.map(([label, href]) => {
      const on = label === cur;
      return { label, href, current: on ? 'page' : 'false', bg: on ? '#2E6A4F' : 'transparent', fg: on ? '#FFFFFF' : '#1D2420', fw: on ? '700' : '400' };
    });
  }
  renderVals() {
    const never = '#8A3A0C', old = '#1D2420', recent = '#59615C';
    return {
      nav: this.navItems('Recommendations'), acctBg: '#F0F2EE', acctFg: '#1D2420',
      items: [
        { name: 'Fish Tacos', last: 'Never cooked', ago: 'New', agoColor: never, tint: '#CFDCCB' },
        { name: 'Lemon Risotto', last: 'Never cooked', ago: 'New', agoColor: never, tint: '#E9E2B8' },
        { name: 'Beef Stew', last: 'Last cooked Jan 10', ago: '9 months ago', agoColor: old, tint: '#D9C7B4' },
        { name: 'Chickpea Curry', last: 'Last cooked Mar 2', ago: '8 months ago', agoColor: old, tint: '#E3D3A4' },
        { name: 'Pad Thai', last: 'Last cooked Aug 2', ago: '3 months ago', agoColor: old, tint: '#E8CFB0' },
        { name: 'Chicken Tikka Masala', last: 'Last cooked Oct 21', ago: '9 days ago', agoColor: recent, tint: '#E6C3A8' }
      ]
    };
  }
}
</script>
</body>
</html>
