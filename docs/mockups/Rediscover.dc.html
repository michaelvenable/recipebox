<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recommendations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 22px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.fw}}; text-decoration: none; white-space: nowrap">{{n.label}}</a>
      </sc-for>
    </div>
    <a href="Account.dc.html" aria-label="Account" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{acctBg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{acctFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </a>
  </nav>
  <header style="padding: 18px 20px 12px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Recommendations</h1>
  </header>
  <div role="group" aria-label="Filter by tag" style="display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 15px; font-weight: {{c.fw}}; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>
  <sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
    <p role="status" style="margin: 0 20px 12px; font-size: 15px; color: #59615C">{{noneText}} <button type="button" onClick="{{clear}}" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #2E6A4F; font: inherit; font-size: 15px; font-weight: 700; text-decoration: underline; cursor: pointer">Show all recipes</button></p>
  </sc-if>
  <ul style="flex: 1; list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <sc-for list="{{items}}" as="r" hint-placeholder-count="6">
      <li>
        <a href="RecipeView.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px; background: #FFFFFF; border-radius: 14px; text-decoration: none; color: #1D2420">
          <div role="img" aria-label="{{r.name}} photo" style="flex: none; width: 56px; height: 56px; border-radius: 10px; background: {{r.tint}}"></div>
          <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
            <span style="font-size: 18px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 14px; color: #59615C">{{r.last}}</span>
          </div>
          <span style="flex: none; font-size: 15px; font-weight: 700; color: {{r.agoColor}}">{{r.ago}}</span>
        </a>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  navItems(cur) {
    const pages = [['Catalog', 'ListEditor.dc.html'], ['Plan', 'ToMake.dc.html'], ['Recommendations', 'Rediscover.dc.html'], ['Trash', 'Trash.dc.html']];
    return pages.map(([label, href]) => {
      const on = label === cur;
      return { label, href, current: on ? 'page' : 'false', bg: on ? '#2E6A4F' : 'transparent', fg: on ? '#FFFFFF' : '#1D2420', fw: on ? '700' : '400' };
    });
  }
  renderVals() {
    const never = '#8A3A0C', old = '#1D2420', recent = '#59615C';
    // Least recently cooked first (COOK-6); a tag filter keeps that order and works like the Catalog's (REC-13).
    const all = [
      { name: 'Fish Tacos', tags: ['dinner', 'quick'], last: 'Never cooked', ago: 'New', agoColor: never, tint: '#CFDCCB' },
      { name: 'Lemon Risotto', tags: ['dinner', 'vegetarian'], last: 'Never cooked', ago: 'New', agoColor: never, tint: '#E9E2B8' },
      { name: 'Blueberry Pancakes', tags: ['breakfast', 'vegetarian'], last: 'Last cooked Dec 28', ago: '10 months ago', agoColor: old, tint: '#D6D9EA' },
      { name: 'Beef Stew', tags: ['dinner'], last: 'Last cooked Jan 10', ago: '9 months ago', agoColor: old, tint: '#D9C7B4' },
      { name: 'Chickpea Curry', tags: ['dinner', 'vegetarian'], last: 'Last cooked Mar 2', ago: '8 months ago', agoColor: old, tint: '#E3D3A4' },
      { name: 'Shakshuka', tags: ['breakfast', 'quick', 'vegetarian'], last: 'Last cooked Jun 14', ago: '4 months ago', agoColor: old, tint: '#E5BFAE' },
      { name: 'Pad Thai', tags: ['dinner', 'quick'], last: 'Last cooked Aug 2', ago: '3 months ago', agoColor: old, tint: '#E8CFB0' },
      { name: 'Chicken Tikka Masala', tags: ['dinner'], last: 'Last cooked Oct 21', ago: '9 days ago', agoColor: recent, tint: '#E6C3A8' }
    ];
    const picked = (this.state && this.state.picked) || [];
    const tags = [...new Set(all.flatMap((r) => r.tags))].sort();
    const items = all.filter((r) => picked.every((t) => r.tags.includes(t)));
    return {
      nav: this.navItems('Recommendations'), acctBg: '#F0F2EE', acctFg: '#1D2420',
      chips: tags.map((t) => {
        const on = picked.includes(t);
        return {
          label: t + ' · ' + all.filter((r) => r.tags.includes(t)).length,
          pressed: on ? 'true' : 'false',
          bg: on ? '#2E6A4F' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1D2420', border: on ? '#2E6A4F' : '#C9CEC8', fw: on ? '700' : '400',
          toggle: () => this.setState({ picked: on ? picked.filter((p) => p !== t) : picked.concat(t) })
        };
      }),
      none: items.length === 0,
      noneText: 'No recipes tagged ' + picked.join(' and '),
      clear: () => this.setState({ picked: [] }),
      items
    };
  }
}
</script>
</body>
</html>
