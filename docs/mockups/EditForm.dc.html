<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit recipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 1480px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <a href="RecipeView.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 10px; font-size: 16px; text-decoration: none">Cancel</a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">Edit recipe</h1>
    <button type="button" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: #2E6A4F; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Save</button>
  </header>
  <form style="display: flex; flex-direction: column; gap: 24px; padding: 20px">
    <div role="alert" style="padding: 12px 14px; border-radius: 12px; background: #FDECEA; color: #8C1D13; font-size: 15px; line-height: 1.4">Not saved. Fix the 2 fields marked below.</div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-size: 15px; font-weight: 700">Name</label>
      <input id="name" type="text" value="" aria-invalid="true" aria-describedby="name-err" style="height: 48px; padding: 0 14px; border: 2px solid #B42318; border-radius: 12px; font: inherit; font-size: 17px; background: #FFFFFF">
      <span id="name-err" style="font-size: 14px; color: #B42318">Enter a name (up to 200 characters).</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Photo</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <div role="img" aria-label="Current photo" style="width: 88px; height: 88px; border-radius: 12px; background: #E8CFB0"></div>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid #C9CEC8; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 15px">Replace</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 0; background: transparent; color: #B42318; font: inherit; font-size: 15px">Remove</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="time" style="font-size: 15px; font-weight: 700">Total time</label>
      <input id="time" type="text" value="0:30" aria-describedby="time-hint" style="width: 120px; height: 48px; padding: 0 14px; border: 1px solid #C9CEC8; border-radius: 12px; font: inherit; font-size: 17px; background: #FFFFFF">
      <span id="time-hint" style="font-size: 13px; color: #59615C">Optional. Examples: 1:30, :45.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ingredients" style="font-size: 15px; font-weight: 700">Ingredients</label>
      <textarea id="ingredients" rows="5" style="width: 100%; box-sizing: border-box; min-height: 141px; padding: 10px 12px; border: 1px solid #C9CEC8; border-radius: 12px; font: inherit; font-size: 17px; line-height: 1.4; background: #FFFFFF; color: #1D2420; resize: vertical">200 g flat rice noodles
3 tbsp tamarind paste
3 tbsp fish sauce
2 tbsp brown sugar</textarea>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="prep" style="font-size: 15px; font-weight: 700">Prep</label>
      <textarea id="prep" rows="5" style="width: 100%; box-sizing: border-box; min-height: 141px; padding: 10px 12px; border: 1px solid #C9CEC8; border-radius: 12px; font: inherit; font-size: 17px; line-height: 1.4; background: #FFFFFF; color: #1D2420; resize: vertical">Soak the rice noodles in warm water for 25 minutes, then drain.
Chop the garlic and slice the shallot.
Stir the tamarind, fish sauce and sugar together until the sugar dissolves.</textarea>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="steps" style="font-size: 15px; font-weight: 700">Steps</label>
      <textarea id="steps" rows="5" aria-invalid="true" aria-describedby="steps-err" style="width: 100%; box-sizing: border-box; min-height: 141px; padding: 10px 12px; border: 2px solid #B42318; border-radius: 12px; font: inherit; font-size: 17px; line-height: 1.4; background: #FFFFFF; color: #1D2420; resize: vertical"></textarea>
      <span id="steps-err" style="font-size: 14px; color: #B42318">Add at least one step. Blank lines are ignored.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="tags" style="font-size: 15px; font-weight: 700">Tags</label>
      <input id="tags" type="text" value="{{tagsTyped}}" autocapitalize="none" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px; border: 2px solid #2E6A4F; border-radius: 12px; font: inherit; font-size: 17px; background: #FFFFFF">
      <div role="group" aria-label="Suggested tags" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{suggestions}}" as="t" hint-placeholder-count="2">
          <button type="button" style="flex: none; min-height: 44px; padding: 0 14px; border: 1px solid #C9CEC8; border-radius: 20px; background: #FFFFFF; color: #1D2420; font: inherit; font-size: 15px">{{t}}</button>
        </sc-for>
      </div>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tagsTyped: 'dinner, noodles, quick, ve',
      suggestions: ['vegan', 'vegetarian']
    };
  }
}
</script>
</body>
</html>
