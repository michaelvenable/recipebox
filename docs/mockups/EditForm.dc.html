<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit recipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 390px; height: 1480px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <a href="RecipeView.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 10px; font-size: 16px; text-decoration: none">Cancel</a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">Edit recipe</h1>
    <button type="button" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: #2E6A4F; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Save</button>
  </header>
  <form style="display: flex; flex-direction: column; gap: 24px; padding: 20px">
    <div role="alert" style="padding: 12px 14px; border-radius: 12px; background: #FDECEA; color: #8C1D13; font-size: 15px; line-height: 1.4">Not saved. Fix the 2 fields marked below.</div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-size: 15px; font-weight: 700">Name</label>
      <input id="name" type="text" value="" aria-invalid="true" aria-describedby="name-err" style="height: 48px; padding: 0 14px; border: 2px solid #B42318; border-radius: 12px; font: inherit; font-size: 17px; background: #FFFFFF">
      <span id="name-err" style="font-size: 14px; color: #B42318">Enter a name (up to 200 characters).</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Photo</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <div role="img" aria-label="Current photo" style="width: 88px; height: 88px; border-radius: 12px; background: #E8CFB0"></div>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid #C9CEC8; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 15px">Replace</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 0; background: transparent; color: #B42318; font: inherit; font-size: 15px">Remove</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="time" style="font-size: 15px; font-weight: 700">Total time (minutes)</label>
      <input id="time" type="number" value="30" style="width: 120px; height: 48px; padding: 0 14px; border: 1px solid #C9CEC8; border-radius: 12px; font: inherit; font-size: 17px; background: #FFFFFF">
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 700">Ingredients</legend>
      <sc-for list="{{ingredients}}" as="i" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 6px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#8C948F" role="img" aria-label="Drag to reorder"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
          <input type="text" value="{{i}}" aria-label="Ingredient" style="flex: 1; min-width: 0; height: 46px; padding: 0 12px; border: 1px solid #C9CEC8; border-radius: 10px; font: inherit; font-size: 16px; background: #FFFFFF">
          <button type="button" aria-label="Remove ingredient" style="flex: none; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#59615C" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </sc-for>
      <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #2E6A4F; font: inherit; font-size: 16px; font-weight: 700">+ Add ingredient</button>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 700">Steps</legend>
      <div style="display: flex; align-items: flex-start; gap: 8px">
        <span style="flex: none; width: 28px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #59615C">1</span>
        <textarea aria-label="Step 1" aria-invalid="true" aria-describedby="steps-err" style="flex: 1; min-height: 72px; padding: 10px 12px; border: 2px solid #B42318; border-radius: 10px; font: inherit; font-size: 16px; background: #FFFFFF; resize: vertical"></textarea>
      </div>
      <span id="steps-err" style="font-size: 14px; color: #B42318">Add at least one step. Blank steps are ignored.</span>
      <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #2E6A4F; font: inherit; font-size: 16px; font-weight: 700">+ Add step</button>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="tag" style="font-size: 15px; font-weight: 700">Tags</label>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{tags}}" as="t" hint-placeholder-count="3">
          <span style="display: inline-flex; align-items: center; gap: 2px; padding-left: 12px; border-radius: 18px; background: #E3EEE7; color: #1F4D38; font-size: 15px">{{t}}
            <button type="button" aria-label="Remove tag {{t}}" style="width: 36px; height: 36px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F4D38" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </span>
        </sc-for>
      </div>
      <div style="position: relative">
        <input id="tag" type="text" value="ve" placeholder="Add a tag" aria-autocomplete="list" aria-controls="tag-suggest" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px; border: 2px solid #2E6A4F; border-radius: 12px; font: inherit; font-size: 17px; background: #FFFFFF">
        <ul id="tag-suggest" role="listbox" style="list-style: none; margin: 6px 0 0; padding: 6px; background: #FFFFFF; border: 1px solid #C9CEC8; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.08)">
          <li role="option" aria-selected="true" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 10px; border-radius: 8px; background: #F0F4F1; font-size: 16px"><span>vegetarian</span><span style="color: #59615C; font-size: 14px">9 recipes</span></li>
          <li role="option" aria-selected="false" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 10px; font-size: 16px"><span>vegan</span><span style="color: #59615C; font-size: 14px">3 recipes</span></li>
          <li role="option" aria-selected="false" style="display: flex; align-items: center; min-height: 44px; padding: 0 10px; font-size: 16px; color: #2E6A4F; font-weight: 700">Add new tag "ve"</li>
        </ul>
      </div>
      <span style="font-size: 13px; color: #59615C">Tags are saved in lowercase. Up to 20 per recipe.</span>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ingredients: ['200 g flat rice noodles', '3 tbsp tamarind paste', '3 tbsp fish sauce', ''],
      tags: ['dinner', 'noodles', 'quick']
    };
  }
}
</script>
</body>
</html>
