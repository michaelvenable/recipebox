<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet — recipe list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6A4F}a:hover{color:#1F4D38}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; background: #F6F6F3; color: #1D2420; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 6px; padding: 12px 24px; background: #FFFFFF; border-bottom: 1px solid #DCDFDA">
    <span style="margin-right: 18px; font-size: 22px; font-weight: 700">RecipeBox</span>
    <a href="TabletList.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #2E6A4F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Recipes</a>
    <a href="ToMake.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; color: #1D2420; font-size: 16px; text-decoration: none">Want to make</a>
    <a href="Rediscover.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; color: #1D2420; font-size: 16px; text-decoration: none">Rediscover</a>
    <a href="Trash.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; color: #1D2420; font-size: 16px; text-decoration: none">Trash</a>
    <a href="Account.dc.html" style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9CEC8; color: #1D2420; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2420" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      Account
    </a>
  </nav>
  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 24px 28px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 14px">
      <label for="tsearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search by name</label>
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; background: #FFFFFF; border: 1px solid #C9CEC8; border-radius: 12px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#59615C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="tsearch" type="search" placeholder="Search by name" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 17px; background: transparent">
      </div>
      <a href="EditForm.dc.html" style="flex: none; display: inline-flex; align-items: center; min-height: 50px; padding: 0 20px; border-radius: 25px; background: #2E6A4F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Add recipe</a>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2E6A4F; background: #2E6A4F; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">dinner · 24</button>
      <button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2E6A4F; background: #2E6A4F; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">quick · 11</button>
      <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; font: inherit; font-size: 15px">vegetarian · 9</button>
      <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; font: inherit; font-size: 15px">dessert · 6</button>
      <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; font: inherit; font-size: 15px">curry · 4</button>
      <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; font: inherit; font-size: 15px">noodles · 3</button>
      <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CEC8; background: #FFFFFF; font: inherit; font-size: 15px">slow · 3</button>
    </div>
    <p style="margin: 0; font-size: 14px; color: #59615C">4 recipes tagged dinner and quick · <a href="TabletList.dc.html">Clear filters</a></p>
    <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{recipes}}" as="r" hint-placeholder-count="4">
        <li>
          <a href="TabletRecipe.dc.html" style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 16px; overflow: hidden; text-decoration: none; color: #1D2420">
            <div role="img" aria-label="{{r.name}} photo" style="height: 130px; background: {{r.tint}}"></div>
            <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px 14px">
              <span style="font-size: 18px; font-weight: 700">{{r.name}}</span>
              <span style="font-size: 14px; color: #59615C">{{r.meta}}</span>
            </div>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      recipes: [
        { name: 'Fish Tacos', meta: '30 min · Want to make', tint: '#CFDCCB' },
        { name: 'Pad Thai', meta: '30 min', tint: '#E8CFB0' },
        { name: 'Shakshuka', meta: '25 min · Want to make', tint: '#E5BFAE' },
        { name: 'Sesame Noodles', meta: '20 min', tint: '#E2D6BE' }
      ]
    };
  }
}
</script>
</body>
</html>
