# Local services for development and integration tests (docs/architecture.md, "Testing"). Tests never touch Azure.
name: recipebox

services:
  cosmos:
    # The Linux "vNext" emulator serves plain HTTP at http://localhost:8081 with the well-known emulator key.
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    command: ["--protocol", "http"]
    ports:
      - "8081:8081"

  azurite:
    # Blob Storage emulator, for photos, and Queue Storage emulator, for the import queue (IMP-1). The Azure SDKs often speak
    # a newer storage API version than the Azurite image knows; --skipApiVersionCheck lets it answer anyway (the calls the app
    # makes are long-standing ones).
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - "azurite"
      - "--blobHost"
      - "0.0.0.0"
      - "--blobPort"
      - "10000"
      - "--queueHost"
      - "0.0.0.0"
      - "--queuePort"
      - "10001"
      - "--skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
